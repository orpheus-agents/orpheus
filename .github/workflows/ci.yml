name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check generation, SQL, modules, lint, dead code, tests, race, vulnerabilities, and build
        run: make check
      - name: Build and smoke-test production image
        run: make smoke
      - name: Stop test services
        if: always()
        run: make stop
  live:
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Live AgentBox, Codex, fault recovery, and account-file tests
        env:
          AGENTBOX_API_KEY: ${{ secrets.AGENTBOX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: make test-live
      - name: Stop test services
        if: always()
        run: make stop
