name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare environment
        run: cp .env.dist .env

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Check OpenAPI schema
        run: |
          make openapi
          git diff --exit-code -- openapi.json
