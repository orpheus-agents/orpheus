x-go-volumes: &go-volumes
  - .:/app
  - go-mod:/go/pkg/mod
  - tools-cache:/home/orpheus/.cache
  - go-build:/home/orpheus/.cache/go-build
x-user-args: &user-args
  ORPHEUS_UID: ${ORPHEUS_UID:-1000}
  ORPHEUS_GID: ${ORPHEUS_GID:-1000}

services:
  app:
    build:
      context: .
      dockerfile: .docker/app/dev/Dockerfile
      args: *user-args
    image: orpheus-app
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://orpheus:orpheus@db:5432/orpheus
      ORPHEUS_CONFIG_FILE: /etc/orpheus/orpheus.toml
    volumes:
      - .:/app
      - ./orpheus.toml:/etc/orpheus/orpheus.toml:ro
      - go-mod:/go/pkg/mod
      - go-build:/home/orpheus/.cache/go-build
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, go, run, ./cmd/orpheus, healthcheck]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 15s

  worker:
    image: orpheus-app
    init: true
    command: [go, run, ./cmd/orpheus, worker]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://orpheus:orpheus@db:5432/orpheus
      ORPHEUS_CONFIG_FILE: /etc/orpheus/orpheus.toml
      AGENTBOX_API_KEY: ${AGENTBOX_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - .:/app
      - ./orpheus.toml:/etc/orpheus/orpheus.toml:ro
      - go-mod:/go/pkg/mod
      - go-build:/home/orpheus/.cache/go-build
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 15s

  tools:
    build:
      context: .
      dockerfile: .docker/tools/Dockerfile
      args: *user-args
    image: ${ORPHEUS_TOOLS_IMAGE:-orpheus-tools}
    profiles: [tools]
    init: true
    working_dir: /app
    volumes: *go-volumes
    environment:
      TEST_DATABASE_URL: postgres://orpheus:orpheus@test-db:5432/orpheus_test
      TEST_S3_ENDPOINT: http://test-s3:9000

  test-s3:
    image: rustfs/rustfs:1.0.0
    profiles: [test]
    command: [/data]
    environment:
      RUSTFS_ACCESS_KEY: orpheus-test
      RUSTFS_SECRET_KEY: orpheus-test-password
    tmpfs: ["/data:uid=10001,gid=10001,mode=0700"]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/health]
      interval: 1s
      timeout: 5s
      retries: 20

  test-db:
    image: postgres:16.10
    profiles: [test]
    environment:
      POSTGRES_DB: orpheus_test
      POSTGRES_USER: orpheus
      POSTGRES_PASSWORD: orpheus
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U orpheus -d orpheus_test]
      interval: 1s
      timeout: 5s
      retries: 20

  db:
    image: postgres:16.10
    environment:
      POSTGRES_DB: orpheus
      POSTGRES_USER: orpheus
      POSTGRES_PASSWORD: orpheus
    volumes: [postgres-go-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U orpheus -d orpheus]
      interval: 2s
      timeout: 5s
      retries: 15
volumes:
  postgres-go-data:
  go-mod:
    name: ${COMPOSE_PROJECT_NAME:-orpheus}-go-mod-${ORPHEUS_UID:-1000}-${ORPHEUS_GID:-1000}
  go-build:
    name: ${COMPOSE_PROJECT_NAME:-orpheus}-go-build-${ORPHEUS_UID:-1000}-${ORPHEUS_GID:-1000}
  tools-cache:
    name: ${COMPOSE_PROJECT_NAME:-orpheus}-tools-cache-${ORPHEUS_UID:-1000}-${ORPHEUS_GID:-1000}
