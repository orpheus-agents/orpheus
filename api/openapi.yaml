components:
    schemas:
        Accepted:
            properties:
                message_id:
                    format: uuid
                    title: Message Id
                    type: string
                run_id:
                    format: uuid
                    title: Run Id
                    type: string
                session_id:
                    format: uuid
                    title: Session Id
                    type: string
            required:
                - session_id
                - run_id
                - message_id
            title: Accepted
            type: object
        AgentConfiguration:
            additionalProperties: false
            properties:
                instructions:
                    title: Instructions
                    type: string
                model:
                    title: Model
                    type: string
                profile:
                    title: Profile
                    type: string
            required:
                - profile
                - model
                - instructions
            title: AgentConfiguration
            type: object
        AgentInput:
            additionalProperties: false
            properties:
                instructions:
                    default: ""
                    title: Instructions
                    type: string
                model:
                    minLength: 1
                    title: Model
                    type: string
                profile:
                    minLength: 1
                    title: Profile
                    type: string
            required:
                - profile
            title: AgentInput
            type: object
        Cancelled:
            properties:
                run_id:
                    format: uuid
                    title: Run Id
                    type: string
                status:
                    enum:
                        - accepted
                        - starting
                        - running
                        - cancelling
                        - completed
                        - failed
                        - cancelled
                    title: Status
                    type: string
            required:
                - run_id
                - status
            title: Cancelled
            type: object
        Configuration:
            additionalProperties: false
            properties:
                agent:
                    $ref: '#/components/schemas/AgentConfiguration'
                limits:
                    $ref: '#/components/schemas/Limits'
                sandbox:
                    $ref: '#/components/schemas/SandboxConfiguration'
            required:
                - agent
                - sandbox
                - limits
            title: Configuration
            type: object
        ConfigurationInput:
            additionalProperties: false
            properties:
                agent:
                    $ref: '#/components/schemas/AgentInput'
                limits:
                    $ref: '#/components/schemas/Limits'
                sandbox:
                    $ref: '#/components/schemas/SandboxInput'
            required:
                - agent
                - sandbox
            title: ConfigurationInput
            type: object
        CreateSession:
            additionalProperties: false
            properties:
                configuration:
                    $ref: '#/components/schemas/ConfigurationInput'
                message:
                    $ref: '#/components/schemas/TextMessage'
            required:
                - configuration
                - message
            title: CreateSession
            type: object
        Error:
            properties:
                code:
                    title: Code
                    type: string
                details:
                    items:
                        $ref: '#/components/schemas/ErrorDetail'
                    title: Details
                    type: array
                message:
                    title: Message
                    type: string
                phase:
                    anyOf:
                        - enum:
                            - preparation
                            - execution
                            - recovery
                          type: string
                        - type: "null"
                    title: Phase
            required:
                - code
                - message
                - phase
                - details
            title: Error
            type: object
        ErrorDetail:
            description: Request validation issue. Paths start with body, header, query, or path; codes never contain input values or native validator messages.
            properties:
                code:
                    enum: [required, invalid_type, invalid_value, unknown_field]
                    title: Code
                    type: string
                path:
                    items:
                        anyOf:
                            - type: string
                            - type: integer
                    title: Path
                    type: array
            required:
                - path
                - code
            title: ErrorDetail
            type: object
        ErrorResponse:
            properties:
                error:
                    $ref: '#/components/schemas/Error'
            required:
                - error
            title: ErrorResponse
            type: object
        Event:
            discriminator:
                mapping:
                    message.updated: '#/components/schemas/MessageEvent'
                    run.updated: '#/components/schemas/RunEvent'
                    sandbox.updated: '#/components/schemas/SandboxEvent'
                    tool_call.updated: '#/components/schemas/ToolCallEvent'
                propertyName: type
            oneOf:
                - $ref: '#/components/schemas/RunEvent'
                - $ref: '#/components/schemas/MessageEvent'
                - $ref: '#/components/schemas/ToolCallEvent'
                - $ref: '#/components/schemas/SandboxEvent'
        EventPage:
            properties:
                has_more:
                    title: Has More
                    type: boolean
                items:
                    items:
                        $ref: '#/components/schemas/Event'
                    title: Items
                    type: array
                next_cursor:
                    title: Next Cursor
                    type: string
            required:
                - items
                - next_cursor
                - has_more
            title: EventPage
            type: object
        HealthResponse:
            properties:
                status:
                    const: ok
                    default: ok
                    title: Status
                    type: string
            required:
                - status
            title: HealthResponse
            type: object
        HistoryPage:
            properties:
                event_cursor:
                    title: Event Cursor
                    type: string
                items:
                    items:
                        discriminator:
                            mapping:
                                message: '#/components/schemas/MessageItem'
                                tool_call: '#/components/schemas/ToolItem'
                            propertyName: type
                        oneOf:
                            - $ref: '#/components/schemas/MessageItem'
                            - $ref: '#/components/schemas/ToolItem'
                    title: Items
                    type: array
                next_cursor:
                    anyOf:
                        - type: string
                        - type: "null"
                    title: Next Cursor
            required:
                - items
                - next_cursor
                - event_cursor
            title: HistoryPage
            type: object
        JSONResult:
            properties:
                original_bytes:
                    anyOf:
                        - type: integer
                        - type: "null"
                    title: Original Bytes
                type:
                    const: json
                    default: json
                    title: Type
                    type: string
                value:
                    title: Value
                    x-go-type: json.RawMessage
            required:
                - value
                - original_bytes
                - type
            title: JSONResult
            type: object
        Limits:
            additionalProperties: false
            properties:
                run_timeout_seconds:
                    default: 3600
                    exclusiveMinimum: 0
                    maximum: 2.147483647e+09
                    title: Run Timeout Seconds
                    type: integer
            title: Limits
            type: object
        Message:
            properties:
                created_at:
                    format: date-time
                    title: Created At
                    type: string
                delivery_status:
                    anyOf:
                        - enum:
                            - pending
                            - sending
                            - delivered
                            - uncertain
                            - rejected
                          type: string
                        - type: "null"
                    title: Delivery Status
                error:
                    anyOf:
                        - $ref: '#/components/schemas/Error'
                        - type: "null"
                id:
                    format: uuid
                    title: Id
                    type: string
                kind:
                    anyOf:
                        - enum:
                            - progress
                            - answer
                          type: string
                        - type: "null"
                    title: Kind
                position:
                    anyOf:
                        - $ref: '#/components/schemas/Position'
                        - type: "null"
                registered_sequence:
                    title: Registered Sequence
                    type: string
                role:
                    enum:
                        - user
                        - assistant
                    title: Role
                    type: string
                run_id:
                    format: uuid
                    title: Run Id
                    type: string
                session_id:
                    format: uuid
                    title: Session Id
                    type: string
                text:
                    title: Text
                    type: string
            required:
                - id
                - session_id
                - run_id
                - role
                - kind
                - text
                - delivery_status
                - error
                - registered_sequence
                - position
                - created_at
            title: Message
            type: object
        MessageEvent:
            properties:
                created_at:
                    format: date-time
                    title: Created At
                    type: string
                data:
                    $ref: '#/components/schemas/Message'
                id:
                    title: Id
                    type: string
                session_id:
                    format: uuid
                    title: Session Id
                    type: string
                type:
                    enum:
                        - message.updated
                    type: string
            required:
                - id
                - session_id
                - type
                - created_at
                - data
            type: object
        MessageItem:
            properties:
                message:
                    $ref: '#/components/schemas/Message'
                type:
                    const: message
                    default: message
                    title: Type
                    type: string
            required:
                - message
                - type
            title: MessageItem
            type: object
        RunPage:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/Run'
                    title: Items
                    type: array
                next_cursor:
                    anyOf:
                        - type: string
                        - type: "null"
                    title: Next Cursor
            required:
                - items
                - next_cursor
            title: RunPage
            type: object
        SessionPage:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/Session'
                    title: Items
                    type: array
                next_cursor:
                    anyOf:
                        - type: string
                        - type: "null"
                    title: Next Cursor
            required:
                - items
                - next_cursor
            title: SessionPage
            type: object
        Position:
            properties:
                item_index:
                    title: Item Index
                    type: integer
                run_number:
                    title: Run Number
                    type: integer
            required:
                - run_number
                - item_index
            title: Position
            type: object
        Run:
            properties:
                cancel_requested_at:
                    anyOf:
                        - format: date-time
                          type: string
                        - type: "null"
                    title: Cancel Requested At
                created_at:
                    format: date-time
                    title: Created At
                    type: string
                deadline_at:
                    anyOf:
                        - format: date-time
                          type: string
                        - type: "null"
                    title: Deadline At
                error:
                    anyOf:
                        - $ref: '#/components/schemas/Error'
                        - type: "null"
                execution_started_at:
                    anyOf:
                        - format: date-time
                          type: string
                        - type: "null"
                    title: Execution Started At
                final_message:
                    anyOf:
                        - $ref: '#/components/schemas/Message'
                        - type: "null"
                finished_at:
                    anyOf:
                        - format: date-time
                          type: string
                        - type: "null"
                    title: Finished At
                id:
                    format: uuid
                    title: Id
                    type: string
                number:
                    title: Number
                    type: integer
                observation:
                    anyOf:
                        - enum:
                            - attached
                            - reconnecting
                            - uncertain
                          type: string
                        - type: "null"
                    title: Observation
                session_id:
                    format: uuid
                    title: Session Id
                    type: string
                status:
                    enum:
                        - accepted
                        - starting
                        - running
                        - cancelling
                        - completed
                        - failed
                        - cancelled
                    title: Status
                    type: string
                stop_method:
                    anyOf:
                        - enum:
                            - graceful
                            - forced
                          type: string
                        - type: "null"
                    title: Stop Method
                stop_reason:
                    anyOf:
                        - enum:
                            - user_request
                            - run_timeout
                          type: string
                        - type: "null"
                    title: Stop Reason
            required:
                - id
                - session_id
                - number
                - status
                - observation
                - created_at
                - execution_started_at
                - deadline_at
                - finished_at
                - cancel_requested_at
                - stop_reason
                - stop_method
                - final_message
                - error
            title: Run
            type: object
        RunEvent:
            properties:
                created_at:
                    format: date-time
                    title: Created At
                    type: string
                data:
                    $ref: '#/components/schemas/Run'
                id:
                    title: Id
                    type: string
                session_id:
                    format: uuid
                    title: Session Id
                    type: string
                type:
                    enum:
                        - run.updated
                    type: string
            required:
                - id
                - session_id
                - type
                - created_at
                - data
            type: object
        SandboxConfiguration:
            additionalProperties: false
            properties:
                env_from:
                    items:
                        type: string
                    title: Env From
                    type: array
                env_names:
                    items:
                        type: string
                    title: Env Names
                    type: array
                template:
                    title: Template
                    type: string
            required:
                - template
                - env_names
                - env_from
            title: SandboxConfiguration
            type: object
        SandboxEvent:
            properties:
                created_at:
                    format: date-time
                    title: Created At
                    type: string
                data:
                    $ref: '#/components/schemas/SandboxState'
                id:
                    title: Id
                    type: string
                session_id:
                    format: uuid
                    title: Session Id
                    type: string
                type:
                    enum:
                        - sandbox.updated
                    type: string
            required:
                - id
                - session_id
                - type
                - created_at
                - data
            type: object
        SandboxInput:
            additionalProperties: false
            properties:
                env:
                    additionalProperties:
                        type: string
                    title: Env
                    type: object
                env_from:
                    items:
                        type: string
                    title: Env From
                    type: array
                template:
                    minLength: 1
                    title: Template
                    type: string
            required:
                - template
            title: SandboxInput
            type: object
        SandboxState:
            properties:
                error:
                    anyOf:
                        - $ref: '#/components/schemas/Error'
                        - type: "null"
                last_known_state:
                    anyOf:
                        - type: string
                        - type: "null"
                    title: Last Known State
                state:
                    enum:
                        - not_created
                        - provisioning
                        - ready
                        - pausing
                        - paused
                        - resuming
                        - unavailable
                    title: State
                    type: string
            required:
                - state
                - last_known_state
                - error
            title: SandboxState
            type: object
        SendMessage:
            additionalProperties: false
            properties:
                message:
                    $ref: '#/components/schemas/TextMessage'
            required:
                - message
            title: SendMessage
            type: object
        Session:
            properties:
                active_run_id:
                    anyOf:
                        - format: uuid
                          type: string
                        - type: "null"
                    title: Active Run Id
                configuration:
                    $ref: '#/components/schemas/Configuration'
                created_at:
                    format: date-time
                    title: Created At
                    type: string
                error:
                    anyOf:
                        - $ref: '#/components/schemas/Error'
                        - type: "null"
                final_message:
                    anyOf:
                        - $ref: '#/components/schemas/Message'
                        - type: "null"
                id:
                    format: uuid
                    title: Id
                    type: string
                last_run_id:
                    format: uuid
                    title: Last Run Id
                    type: string
                sandbox:
                    $ref: '#/components/schemas/SandboxState'
                status:
                    enum:
                        - accepted
                        - starting
                        - running
                        - cancelling
                        - completed
                        - failed
                        - cancelled
                    title: Status
                    type: string
            required:
                - id
                - created_at
                - configuration
                - sandbox
                - active_run_id
                - last_run_id
                - status
                - final_message
                - error
            title: Session
            type: object
        TextMessage:
            additionalProperties: false
            properties:
                text:
                    minLength: 1
                    title: Text
                    type: string
            required:
                - text
            title: TextMessage
            type: object
        TextResult:
            properties:
                exit_code:
                    anyOf:
                        - type: integer
                        - type: "null"
                    title: Exit Code
                original_bytes:
                    anyOf:
                        - type: integer
                        - type: "null"
                    title: Original Bytes
                text:
                    title: Text
                    type: string
                type:
                    const: text
                    default: text
                    title: Type
                    type: string
            required:
                - text
                - original_bytes
                - type
            title: TextResult
            type: object
        ToolCall:
            properties:
                created_at:
                    format: date-time
                    title: Created At
                    type: string
                id:
                    format: uuid
                    title: Id
                    type: string
                input:
                    title: Input
                    x-go-type: json.RawMessage
                name:
                    title: Name
                    type: string
                output_completeness:
                    enum:
                        - complete
                        - truncated
                        - unavailable
                        - unknown
                    title: Output Completeness
                    type: string
                position:
                    anyOf:
                        - $ref: '#/components/schemas/Position'
                        - type: "null"
                registered_sequence:
                    title: Registered Sequence
                    type: string
                result:
                    anyOf:
                        - $ref: '#/components/schemas/ToolResult'
                        - type: "null"
                    title: Result
                run_id:
                    format: uuid
                    title: Run Id
                    type: string
                session_id:
                    format: uuid
                    title: Session Id
                    type: string
                status:
                    enum:
                        - running
                        - completed
                        - failed
                        - cancelled
                        - unknown
                    title: Status
                    type: string
                truncation_reason:
                    anyOf:
                        - enum:
                            - orpheus_limit
                            - harness_limit
                          type: string
                        - type: "null"
                    title: Truncation Reason
            required:
                - id
                - session_id
                - run_id
                - name
                - input
                - status
                - result
                - output_completeness
                - truncation_reason
                - registered_sequence
                - position
                - created_at
            title: ToolCall
            type: object
        ToolResult:
            discriminator:
                mapping:
                    json: '#/components/schemas/JSONResult'
                    text: '#/components/schemas/TextResult'
                    truncated_text: '#/components/schemas/TruncatedResult'
                propertyName: type
            oneOf:
                - $ref: '#/components/schemas/TextResult'
                - $ref: '#/components/schemas/JSONResult'
                - $ref: '#/components/schemas/TruncatedResult'
        ToolCallEvent:
            properties:
                created_at:
                    format: date-time
                    title: Created At
                    type: string
                data:
                    $ref: '#/components/schemas/ToolCall'
                id:
                    title: Id
                    type: string
                session_id:
                    format: uuid
                    title: Session Id
                    type: string
                type:
                    enum:
                        - tool_call.updated
                    type: string
            required:
                - id
                - session_id
                - type
                - created_at
                - data
            type: object
        ToolItem:
            properties:
                tool_call:
                    $ref: '#/components/schemas/ToolCall'
                type:
                    const: tool_call
                    default: tool_call
                    title: Type
                    type: string
            required:
                - tool_call
                - type
            title: ToolItem
            type: object
        TruncatedResult:
            properties:
                exit_code:
                    anyOf:
                        - type: integer
                        - type: "null"
                    title: Exit Code
                head:
                    title: Head
                    type: string
                original_bytes:
                    anyOf:
                        - type: integer
                        - type: "null"
                    title: Original Bytes
                source_type:
                    default: text
                    enum:
                        - text
                        - json
                    title: Source Type
                    type: string
                tail:
                    title: Tail
                    type: string
                type:
                    const: truncated_text
                    default: truncated_text
                    title: Type
                    type: string
            required:
                - head
                - tail
                - original_bytes
                - type
            title: TruncatedResult
            type: object
        UnavailableResponse:
            properties:
                status:
                    const: unavailable
                    default: unavailable
                    title: Status
                    type: string
            required:
                - status
            title: UnavailableResponse
            type: object
    securitySchemes:
        HTTPBearer:
            scheme: bearer
            type: http
info:
    description: Durable agent sessions in AgentBox sandboxes.
    license:
        identifier: MIT
        name: MIT
    title: Orpheus
    version: 0.1.0
openapi: 3.1.0
paths:
    /api/v1/sessions:
        get:
            description: List Sessions
            operationId: list_sessions
            parameters:
                - in: query
                  name: limit
                  required: false
                  schema:
                    default: 50
                    maximum: 200
                    minimum: 1
                    title: Limit
                    type: integer
                - in: query
                  name: cursor
                  required: false
                  schema:
                    anyOf:
                        - type: string
                        - type: "null"
                    title: Cursor
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SessionPage'
                    description: Successful Response
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Unauthorized
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Not Found
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Conflict
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Content Too Large
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Unsupported Media Type
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Unprocessable Content
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Service Unavailable
            security:
                - HTTPBearer: []
            summary: List Sessions
        post:
            description: Create Session
            operationId: create_session
            parameters:
                - in: header
                  name: Idempotency-Key
                  required: false
                  schema:
                    anyOf:
                        - type: string
                        - type: "null"
                    title: Idempotency-Key
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateSession'
                required: true
            responses:
                "202":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Accepted'
                    description: Successful Response
                    headers:
                        Location:
                            description: URL of the accepted run.
                            required: true
                            schema:
                                type: string
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Unauthorized
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Not Found
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Conflict
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Content Too Large
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Unsupported Media Type
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Unprocessable Content
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Service Unavailable
            security:
                - HTTPBearer: []
            summary: Create Session
    /api/v1/sessions/{sid}:
        get:
            description: Read Session
            operationId: get_session
            parameters:
                - in: path
                  name: sid
                  required: true
                  schema:
                    format: uuid
                    title: Sid
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Session'
                    description: Successful Response
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Unauthorized
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Not Found
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Conflict
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Content Too Large
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Unsupported Media Type
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Unprocessable Content
                "503":
