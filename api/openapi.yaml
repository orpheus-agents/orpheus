components:
    schemas:
        RunStatus:
            type: string
            enum: [accepted, starting, running, cancelling, finalizing, completed, failed, cancelled]
        Accepted:
            properties:
                message_id:
                    format: uuid
                    title: Message Id
                    type: string
                run_id:
                    format: uuid
                    title: Run Id
                    type: string
                session_id:
                    format: uuid
                    title: Session Id
                    type: string
            required:
                - session_id
                - run_id
                - message_id
            title: Accepted
            type: object
        AgentConfiguration:
            additionalProperties: false
            properties:
                instructions:
                    title: Instructions
                    type: string
                model:
                    title: Model
                    type: string
                profile:
                    title: Profile
                    type: string
            required:
                - profile
                - model
                - instructions
            title: AgentConfiguration
            type: object
        AgentInput:
            additionalProperties: false
            properties:
                instructions:
                    default: ""
                    title: Instructions
                    type: string
                model:
                    minLength: 1
                    title: Model
                    type: string
                profile:
                    minLength: 1
                    title: Profile
                    type: string
            required:
                - profile
            title: AgentInput
            type: object
        Cancelled:
            properties:
                run_id:
                    format: uuid
                    title: Run Id
                    type: string
                status:
                    $ref: '#/components/schemas/RunStatus'
            required:
                - run_id
                - status
            title: Cancelled
            type: object
        Configuration:
            additionalProperties: false
            properties:
                agent:
                    $ref: '#/components/schemas/AgentConfiguration'
                hooks:
                    $ref: '#/components/schemas/HooksConfiguration'
                limits:
                    $ref: '#/components/schemas/Limits'
                sandbox:
                    $ref: '#/components/schemas/SandboxConfiguration'
            required:
                - agent
                - sandbox
                - limits
                - hooks
            title: Configuration
            type: object
        ConfigurationInput:
            additionalProperties: false
            properties:
                agent:
                    $ref: '#/components/schemas/AgentInput'
                hooks:
                    $ref: '#/components/schemas/HooksInput'
                limits:
                    $ref: '#/components/schemas/LimitsInput'
                sandbox:
                    $ref: '#/components/schemas/SandboxInput'
            required:
                - agent
                - sandbox
            title: ConfigurationInput
            type: object
        CreateSession:
            additionalProperties: false
            properties:
                namespace:
                    description: Logical integration or workflow name. Opaque identifier, 1–128 UTF-8 bytes; no NUL or whitespace-only value. Compared exactly, without normalization.
                    type: string
                    minLength: 1
                    maxLength: 128
                external_key:
                    description: Source-qualified external object key; not unique across sessions. Opaque identifier, 1–512 UTF-8 bytes; no NUL or whitespace-only value. Compared exactly, without normalization.
                    type: string
                    minLength: 1
                    maxLength: 512
                input_fingerprint:
                    description: Opaque input snapshot version for the first run; does not deduplicate requests. Opaque identifier, 1–256 UTF-8 bytes; no NUL or whitespace-only value. Compared exactly, without normalization.
                    type: string
                    minLength: 1
                    maxLength: 256
                configuration:
                    $ref: '#/components/schemas/ConfigurationInput'
                message:
                    $ref: '#/components/schemas/TextMessage'
                env:
                    description: Explicit environment variables for the first run's before_run and after_run hooks only. Override session sources with the same names; never passed to the harness, after_create, or before_remove.
                    type: object
                    additionalProperties:
                        type: string
                env_from:
                    description: Allowlisted orchestrator environment variable names for the first run's before_run and after_run hooks only. Resolved before each hook; override session sources and are never passed to the harness, after_create, or before_remove.
                    type: array
                    items:
                        type: string
            required:
                - configuration
                - message
            title: CreateSession
            type: object
        Error:
            properties:
                code:
                    title: Code
                    type: string
                details:
                    items:
                        $ref: '#/components/schemas/ErrorDetail'
                    title: Details
                    type: array
                message:
                    title: Message
                    type: string
                phase:
                    anyOf:
                        - enum:
                            - preparation
                            - execution
                            - finalization
                            - recovery
                          type: string
                        - type: "null"
                    title: Phase
            required:
                - code
                - message
                - phase
                - details
            title: Error
            type: object
        ErrorDetail:
            description: Validation paths start with body, header, query, or path. Hook execution errors identify configuration.hooks.<name>; codes never contain input values or native validator messages.
            properties:
                code:
                    enum: [required, invalid_type, invalid_value, unknown_field]
                    title: Code
                    type: string
                path:
                    items:
                        anyOf:
                            - type: string
                            - type: integer
                    title: Path
                    type: array
            required:
                - path
                - code
            title: ErrorDetail
            type: object
        ErrorResponse:
            properties:
                error:
                    $ref: '#/components/schemas/Error'
            required:
                - error
            title: ErrorResponse
            type: object
        Event:
            discriminator:
                mapping:
                    message.updated: '#/components/schemas/MessageEvent'
                    run.updated: '#/components/schemas/RunEvent'
                    sandbox.updated: '#/components/schemas/SandboxEvent'
                    tool_call.updated: '#/components/schemas/ToolCallEvent'
                propertyName: type
            oneOf:
                - $ref: '#/components/schemas/RunEvent'
                - $ref: '#/components/schemas/MessageEvent'
                - $ref: '#/components/schemas/ToolCallEvent'
                - $ref: '#/components/schemas/SandboxEvent'
        EventPage:
            properties:
                has_more:
                    title: Has More
                    type: boolean
                items:
                    items:
                        $ref: '#/components/schemas/Event'
                    title: Items
                    type: array
                next_cursor:
                    title: Next Cursor
                    type: string
            required:
                - items
                - next_cursor
                - has_more
            title: EventPage
            type: object
        HealthResponse:
            properties:
                status:
                    const: ok
                    default: ok
                    title: Status
                    type: string
            required:
                - status
            title: HealthResponse
            type: object
        HooksConfiguration:
            additionalProperties: false
            properties:
                after_create:
                    type: string
                before_run:
                    type: string
                after_run:
                    type: string
                before_remove:
                    type: string
                timeout_seconds:
                    type: integer
                    minimum: 1
                    maximum: 2147483647
            required:
                - timeout_seconds
            type: object
        HooksInput:
            additionalProperties: false
            properties:
                after_create:
                    description: Executable script text with a shebang; runs once after workspace creation.
                    type: string
                before_run:
                    description: Executable script text with a shebang; runs before every assignment.
                    type: string
                after_run:
                    description: Executable script text with a shebang; runs after confirmed agent completion, before pause.
                    type: string
                before_remove:
                    description: Accepted for future explicit sandbox removal; never called by this API version.
                    type: string
                timeout_seconds:
                    description: Timeout for each hook invocation.
                    type: integer
                    default: 300
                    minimum: 1
                    maximum: 2147483647
            type: object
        HookResult:
            properties:
                id:
                    type: string
                    format: uuid
                name:
                    type: string
                    enum: [after_create, before_run, after_run, before_remove]
                status:
                    type: string
                    enum: [pending, running, completed, failed, cancelled, skipped]
                started_at:
                    anyOf:
                        - type: string
                          format: date-time
                        - type: 'null'
                deadline_at:
                    anyOf:
                        - type: string
                          format: date-time
                        - type: 'null'
                finished_at:
                    anyOf:
                        - type: string
                          format: date-time
                        - type: 'null'
                exit_code:
                    anyOf:
                        - type: integer
                        - type: 'null'
                signal:
                    anyOf:
                        - type: integer
                        - type: 'null'
                output:
                    anyOf:
                        - $ref: '#/components/schemas/TextResult'
                        - $ref: '#/components/schemas/TruncatedResult'
                        - type: 'null'
                output_completeness:
                    type: string
                    enum: [complete, truncated, unavailable, unknown]
                truncation_reason:
                    anyOf:
                        - type: string
                          enum: [orpheus_limit]
                        - type: 'null'
                error:
                    anyOf:
                        - $ref: '#/components/schemas/Error'
                        - type: 'null'
            required: [id, name, status, started_at, deadline_at, finished_at, exit_code, signal, output, output_completeness, truncation_reason, error]
            type: object
        HistoryPage:
            properties:
                event_cursor:
                    title: Event Cursor
                    type: string
                items:
                    items:
                        discriminator:
                            mapping:
                                message: '#/components/schemas/MessageItem'
                                tool_call: '#/components/schemas/ToolItem'
                            propertyName: type
                        oneOf:
                            - $ref: '#/components/schemas/MessageItem'
                            - $ref: '#/components/schemas/ToolItem'
                    title: Items
                    type: array
                next_cursor:
                    anyOf:
                        - type: string
                        - type: "null"
                    title: Next Cursor
            required:
                - items
                - next_cursor
                - event_cursor
            title: HistoryPage
            type: object
        JSONResult:
            properties:
                original_bytes:
                    anyOf:
                        - type: integer
                        - type: "null"
                    title: Original Bytes
                type:
                    const: json
                    default: json
                    title: Type
                    type: string
                value:
                    title: Value
                    x-go-type: json.RawMessage
            required:
                - value
                - original_bytes
                - type
            title: JSONResult
            type: object
        LimitsInput:
            additionalProperties: false
            properties:
                max_session_tokens:
                    description: Session-wide input and output token budget. Omission uses DEFAULT_MAX_SESSION_TOKENS (100000000 by default); explicit null is invalid.
                    type: integer
                    format: int64
                    minimum: 1
                    maximum: 9223372036854775807
                run_timeout_seconds:
                    default: 3600
                    exclusiveMinimum: 0
                    maximum: 2.147483647e+09
                    title: Run Timeout Seconds
                    type: integer
            title: LimitsInput
            type: object
        Limits:
            additionalProperties: false
            properties:
                max_session_tokens:
                    description: Session-wide input and output token budget. Omission uses DEFAULT_MAX_SESSION_TOKENS (100000000 by default); explicit null is invalid.
                    type: integer
                    format: int64
                    minimum: 1
                    maximum: 9223372036854775807
                run_timeout_seconds:
                    default: 3600
                    exclusiveMinimum: 0
                    maximum: 2.147483647e+09
                    title: Run Timeout Seconds
                    type: integer
            required: [run_timeout_seconds, max_session_tokens]
            title: Limits
            type: object
        Usage:
            type: object
            description: Last reported token consumption; missed reports are not reconstructed from history. Cached input and reasoning output are already included.
            required: [input_tokens, output_tokens, total_tokens]
            properties:
                input_tokens:
                    type: integer
                    format: int64
                    minimum: 0
                output_tokens:
                    type: integer
                    format: int64
                    minimum: 0
                total_tokens:
                    type: integer
                    format: int64
                    minimum: 0
        Message:
            properties:
                external_key:
                    description: External key supplied for an incoming message; null for agent messages. Opaque identifier, 1–512 UTF-8 bytes; no NUL or whitespace-only value. Compared exactly, without normalization.
                    anyOf:
                        - type: string
                        - type: "null"
                created_at:
                    format: date-time
                    title: Created At
                    type: string
                delivery_status:
                    anyOf:
                        - enum:
                            - pending
                            - sending
                            - delivered
                            - uncertain
                            - rejected
                          type: string
                        - type: "null"
                    title: Delivery Status
                error:
                    anyOf:
                        - $ref: '#/components/schemas/Error'
                        - type: "null"
                id:
                    format: uuid
                    title: Id
                    type: string
                kind:
                    anyOf:
                        - enum:
                            - progress
                            - answer
                          type: string
                        - type: "null"
                    title: Kind
                position:
                    anyOf:
                        - $ref: '#/components/schemas/Position'
                        - type: "null"
                registered_sequence:
                    title: Registered Sequence
                    type: string
                role:
                    enum:
                        - user
                        - assistant
                    title: Role
                    type: string
                run_id:
                    format: uuid
                    title: Run Id
                    type: string
                session_id:
                    format: uuid
                    title: Session Id
                    type: string
                text:
                    title: Text
                    type: string
            required:
                - external_key
                - id
                - session_id
                - run_id
                - role
                - kind
                - text
                - delivery_status
                - error
                - registered_sequence
                - position
                - created_at
            title: Message
            type: object
        MessageEvent:
            properties:
                created_at:
                    format: date-time
                    title: Created At
                    type: string
                data:
                    $ref: '#/components/schemas/Message'
                id:
                    title: Id
                    type: string
                session_id:
                    format: uuid
                    title: Session Id
                    type: string
                type:
                    enum:
                        - message.updated
                    type: string
            required:
                - id
                - session_id
                - type
                - created_at
                - data
            type: object
        MessageItem:
            properties:
                message:
                    $ref: '#/components/schemas/Message'
                type:
                    const: message
                    default: message
                    title: Type
                    type: string
            required:
                - message
                - type
            title: MessageItem
            type: object
        RunPage:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/Run'
                    title: Items
                    type: array
                next_cursor:
                    anyOf:
                        - type: string
                        - type: "null"
                    title: Next Cursor
            required:
                - items
                - next_cursor
            title: RunPage
            type: object
        SessionPage:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/Session'
                    title: Items
                    type: array
                next_cursor:
                    anyOf:
                        - type: string
                        - type: "null"
                    title: Next Cursor
            required:
                - items
                - next_cursor
            title: SessionPage
            type: object
        Position:
            properties:
                item_index:
                    title: Item Index
                    type: integer
                run_number:
                    title: Run Number
                    type: integer
            required:
                - run_number
                - item_index
            title: Position
            type: object
        Run:
            properties:
                usage:
                    $ref: '#/components/schemas/Usage'
                phase:
                    anyOf:
                        - type: string
                          enum: [preparation, after_create, before_run, agent, after_run]
                        - type: 'null'
                agent_status:
                    anyOf:
                        - type: string
                          enum: [completed, failed, cancelled]
                        - type: 'null'
                agent_error:
                    anyOf:
                        - $ref: '#/components/schemas/Error'
                        - type: 'null'
                hooks:
                    type: array
                    items:
                        $ref: '#/components/schemas/HookResult'
                env_names:
                    description: Sorted names of explicit variables supplied for this run; values are never returned.
                    type: array
                    items:
                        type: string
                env_from:
                    description: Sorted orchestrator environment variable names supplied for this run.
                    type: array
                    items:
                        type: string
                input_fingerprint:
                    description: Input snapshot version supplied when the run was accepted. Opaque identifier, 1–256 UTF-8 bytes; no NUL or whitespace-only value. Compared exactly, without normalization.
                    anyOf:
                        - type: string
                        - type: "null"
                cancel_requested_at:
                    anyOf:
                        - format: date-time
                          type: string
                        - type: "null"
                    title: Cancel Requested At
                created_at:
                    format: date-time
                    title: Created At
                    type: string
                deadline_at:
                    anyOf:
                        - format: date-time
                          type: string
                        - type: "null"
                    title: Deadline At
                error:
                    anyOf:
                        - $ref: '#/components/schemas/Error'
                        - type: "null"
                execution_started_at:
                    anyOf:
                        - format: date-time
                          type: string
                        - type: "null"
                    title: Execution Started At
                final_message:
                    anyOf:
                        - $ref: '#/components/schemas/Message'
                        - type: "null"
                finished_at:
                    anyOf:
                        - format: date-time
                          type: string
                        - type: "null"
                    title: Finished At
                id:
                    format: uuid
                    title: Id
                    type: string
                number:
                    title: Number
                    type: integer
                observation:
                    anyOf:
                        - enum:
                            - attached
                            - reconnecting
                            - uncertain
                          type: string
                        - type: "null"
                    title: Observation
                session_id:
                    format: uuid
                    title: Session Id
                    type: string
                status:
                    $ref: '#/components/schemas/RunStatus'
                stop_method:
                    anyOf:
                        - enum:
                            - graceful
                            - forced
                          type: string
                        - type: "null"
                    title: Stop Method
                stop_reason:
                    anyOf:
                        - enum:
                            - user_request
                            - run_timeout
                            - token_limit
                          type: string
                        - type: "null"
                    title: Stop Reason
            required:
                - usage
                - phase
                - agent_status
                - agent_error
                - hooks
                - input_fingerprint
                - env_names
                - env_from
                - id
                - session_id
                - number
                - status
                - observation
                - created_at
                - execution_started_at
                - deadline_at
                - finished_at
                - cancel_requested_at
                - stop_reason
                - stop_method
                - final_message
                - error
            title: Run
            type: object
        RunEvent:
            properties:
                created_at:
                    format: date-time
                    title: Created At
                    type: string
                data:
                    $ref: '#/components/schemas/Run'
                id:
                    title: Id
                    type: string
                session_id:
                    format: uuid
                    title: Session Id
                    type: string
                type:
                    enum:
                        - run.updated
                    type: string
            required:
                - id
                - session_id
                - type
                - created_at
                - data
            type: object
        SandboxConfiguration:
            additionalProperties: false
            properties:
                env_from:
                    items:
                        type: string
                    title: Env From
                    type: array
                env_names:
                    items:
                        type: string
                    title: Env Names
                    type: array
                template:
                    title: Template
                    type: string
            required:
                - template
                - env_names
                - env_from
            title: SandboxConfiguration
            type: object
        SandboxEvent:
            properties:
                created_at:
                    format: date-time
                    title: Created At
                    type: string
                data:
                    $ref: '#/components/schemas/SandboxState'
                id:
                    title: Id
                    type: string
                session_id:
                    format: uuid
                    title: Session Id
                    type: string
                type:
                    enum:
                        - sandbox.updated
                    type: string
            required:
                - id
                - session_id
                - type
                - created_at
                - data
            type: object
        SandboxInput:
            additionalProperties: false
            properties:
                env:
                    additionalProperties:
                        type: string
                    title: Env
                    type: object
                env_from:
                    items:
                        type: string
                    title: Env From
                    type: array
                template:
                    minLength: 1
                    title: Template
                    type: string
            required:
                - template
            title: SandboxInput
            type: object
        SandboxState:
            properties:
                error:
                    anyOf:
                        - $ref: '#/components/schemas/Error'
                        - type: "null"
                id:
                    anyOf:
                        - type: string
                        - type: "null"
                    description: AgentBox sandbox ID, if known. A retained ID does not guarantee that an unavailable sandbox is accessible.
                last_known_state:
                    anyOf:
                        - type: string
                        - type: "null"
                    title: Last Known State
                state:
                    enum:
                        - not_created
                        - provisioning
                        - ready
                        - pausing
                        - paused
                        - resuming
                        - unavailable
                    title: State
                    type: string
                workspace:
                    anyOf:
                        - type: string
                        - type: "null"
                    description: Absolute workspace path resolved during sandbox preparation, if known.
            required:
                - state
                - last_known_state
                - error
                - id
                - workspace
            title: SandboxState
            type: object
        CreateRun:
            additionalProperties: false
            properties:
                input_fingerprint:
                    description: Opaque input snapshot version for this run; does not deduplicate requests. Opaque identifier, 1–256 UTF-8 bytes; no NUL or whitespace-only value. Compared exactly, without normalization.
                    type: string
                    minLength: 1
                    maxLength: 256
                message:
                    $ref: '#/components/schemas/TextMessage'
                env:
                    description: Explicit environment variables available only to this run's before_run and after_run hooks. Override session sources with the same names; never passed to the harness, after_create, or before_remove.
                    type: object
                    additionalProperties:
                        type: string
                env_from:
                    description: Allowlisted orchestrator environment variable names available only to this run's before_run and after_run hooks. Resolved before each hook; override session sources and are never passed to the harness, after_create, or before_remove.
                    type: array
                    items:
                        type: string
            required:
                - message
            title: CreateRun
            type: object
        SendMessage:
            additionalProperties: false
            properties:
                message:
                    $ref: '#/components/schemas/TextMessage'
            required:
                - message
            title: SendMessage
            type: object
        Session:
            properties:
                usage:
                    $ref: '#/components/schemas/Usage'
                phase:
                    anyOf:
                        - type: string
                          enum: [preparation, after_create, before_run, agent, after_run]
                        - type: 'null'
                namespace:
                    description: Logical integration or workflow name. Opaque identifier, 1–128 UTF-8 bytes; no NUL or whitespace-only value. Compared exactly, without normalization.
                    anyOf:
                        - type: string
                        - type: "null"
                external_key:
                    description: Source-qualified external object key; not unique across sessions. Opaque identifier, 1–512 UTF-8 bytes; no NUL or whitespace-only value. Compared exactly, without normalization.
                    anyOf:
                        - type: string
                        - type: "null"
                active_run_id:
                    anyOf:
                        - format: uuid
                          type: string
                        - type: "null"
                    title: Active Run Id
                configuration:
                    $ref: '#/components/schemas/Configuration'
                created_at:
                    format: date-time
                    title: Created At
                    type: string
                error:
                    anyOf:
                        - $ref: '#/components/schemas/Error'
                        - type: "null"
                final_message:
                    anyOf:
                        - $ref: '#/components/schemas/Message'
                        - type: "null"
                id:
                    format: uuid
                    title: Id
                    type: string
                last_run_id:
                    format: uuid
                    title: Last Run Id
                    type: string
                sandbox:
                    $ref: '#/components/schemas/SandboxState'
                status:
                    $ref: '#/components/schemas/RunStatus'
            required:
                - usage
                - phase
                - namespace
                - external_key
                - id
                - created_at
                - configuration
                - sandbox
                - active_run_id
                - last_run_id
                - status
                - final_message
                - error
            title: Session
            type: object
        TextMessage:
            additionalProperties: false
            properties:
                external_key:
                    description: External message or event key; not unique and not sent to the harness. Opaque identifier, 1–512 UTF-8 bytes; no NUL or whitespace-only value. Compared exactly, without normalization.
                    type: string
                    minLength: 1
                    maxLength: 512
                text:
                    minLength: 1
                    title: Text
                    type: string
            required:
                - text
            title: TextMessage
            type: object
        TextResult:
            properties:
                exit_code:
                    anyOf:
                        - type: integer
                        - type: "null"
                    title: Exit Code
                original_bytes:
                    anyOf:
                        - type: integer
                        - type: "null"
                    title: Original Bytes
                text:
                    title: Text
                    type: string
                type:
                    const: text
                    default: text
                    title: Type
                    type: string
            required:
                - text
                - original_bytes
                - type
            title: TextResult
            type: object
        ToolCall:
            properties:
                created_at:
                    format: date-time
                    title: Created At
                    type: string
                id:
                    format: uuid
                    title: Id
                    type: string
                input:
                    title: Input
                    x-go-type: json.RawMessage
                name:
                    title: Name
                    type: string
                output_completeness:
                    enum:
                        - complete
                        - truncated
                        - unavailable
                        - unknown
                    title: Output Completeness
                    type: string
                position:
                    anyOf:
                        - $ref: '#/components/schemas/Position'
                        - type: "null"
                registered_sequence:
                    title: Registered Sequence
                    type: string
                result:
                    anyOf:
                        - $ref: '#/components/schemas/ToolResult'
                        - type: "null"
                    title: Result
                run_id:
                    format: uuid
                    title: Run Id
                    type: string
                session_id:
                    format: uuid
                    title: Session Id
                    type: string
                status:
                    enum:
                        - running
                        - completed
                        - failed
                        - cancelled
                        - unknown
                    title: Status
                    type: string
                truncation_reason:
                    anyOf:
                        - enum:
                            - orpheus_limit
                            - harness_limit
                          type: string
                        - type: "null"
                    title: Truncation Reason
            required:
                - id
                - session_id
                - run_id
                - name
                - input
                - status
                - result
                - output_completeness
                - truncation_reason
                - registered_sequence
                - position
                - created_at
            title: ToolCall
            type: object
        ToolResult:
            discriminator:
                mapping:
                    json: '#/components/schemas/JSONResult'
                    text: '#/components/schemas/TextResult'
                    truncated_text: '#/components/schemas/TruncatedResult'
                propertyName: type
            oneOf:
                - $ref: '#/components/schemas/TextResult'
                - $ref: '#/components/schemas/JSONResult'
                - $ref: '#/components/schemas/TruncatedResult'
        ToolCallEvent:
            properties:
                created_at:
                    format: date-time
                    title: Created At
                    type: string
                data:
                    $ref: '#/components/schemas/ToolCall'
                id:
                    title: Id
                    type: string
                session_id:
                    format: uuid
                    title: Session Id
                    type: string
                type:
                    enum:
                        - tool_call.updated
                    type: string
            required:
                - id
                - session_id
                - type
                - created_at
                - data
            type: object
        ToolItem:
            properties:
                tool_call:
                    $ref: '#/components/schemas/ToolCall'
                type:
                    const: tool_call
                    default: tool_call
                    title: Type
                    type: string
            required:
                - tool_call
                - type
            title: ToolItem
            type: object
        TruncatedResult:
            properties:
                exit_code:
                    anyOf:
                        - type: integer
                        - type: "null"
                    title: Exit Code
                head:
                    title: Head
                    type: string
                original_bytes:
                    anyOf:
                        - type: integer
                        - type: "null"
                    title: Original Bytes
                source_type:
                    default: text
                    enum:
                        - text
                        - json
                    title: Source Type
                    type: string
                tail:
                    title: Tail
                    type: string
                type:
                    const: truncated_text
                    default: truncated_text
                    title: Type
                    type: string
            required:
                - head
                - tail
                - original_bytes
                - type
            title: TruncatedResult
            type: object
        UnavailableResponse:
            properties:
                status:
                    const: unavailable
                    default: unavailable
                    title: Status
                    type: string
            required:
                - status
            title: UnavailableResponse
            type: object
    securitySchemes:
        HTTPBearer:
            scheme: bearer
            type: http
